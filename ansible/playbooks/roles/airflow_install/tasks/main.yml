# Main flow
---
- name: Create airflow group
  become: true
  ansible.builtin.group:
    name: "{{ airflow_group }}"
    state: present

- name: Create airflow user
  become: true
  ansible.builtin.user:
    name: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    shell: "/bin/bash"
    create_home: true
    home: "{{ airflow_home }}"

- name: Install required packages
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - libpq-dev
      - build-essential
      - redis-server
      - git
      - acl
      # - postgresql
      # - postgresql-contrib
    state: present
    update_cache: yes

- name: Create Python virtual environment
  become: true
  become_user: "{{ airflow_user }}"
  ansible.builtin.command:
    cmd: python3 -m venv {{ airflow_venv }}
    creates: "{{ airflow_venv }}/bin/python3"

- name: Upgrade pip
  become: true
  become_user: "{{ airflow_user }}"
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ airflow_venv }}"

- name: Upgrade setuptools
  become: true
  become_user: "{{ airflow_user }}"
  ansible.builtin.pip:
    name: setuptools
    state: latest
    virtualenv: "{{ airflow_venv }}"

- name: Install Python Packages
  become: true
  become_user: "{{ airflow_user }}"
  ansible.builtin.pip:
    virtualenv: "{{ airflow_venv }}"
    name:
      - psycopg2-binary
      - asyncpg
      - pandas

- name: Install Apache Airflow
  become: true
  become_user: "{{ airflow_user }}"
  ansible.builtin.pip:
    virtualenv: "{{ airflow_venv }}"
    extra_args: >
      --constraint
      https://raw.githubusercontent.com/apache/airflow/constraints-{{ airflow_version }}/constraints-{{ python_version }}.txt
    name:
      - apache-airflow-core
      - "apache-airflow[celery]=={{ airflow_version }}"

- name: Install Airflow providers
  become: true
  become_user: "{{ airflow_user }}"
  ansible.builtin.pip:
    virtualenv: "{{ airflow_venv }}"
    name:
      - apache-airflow-providers-common-io
      - apache-airflow-providers-common-sql
      - apache-airflow-providers-ftp
      - apache-airflow-providers-sftp
      - apache-airflow-providers-http
      - apache-airflow-providers-grpc
      - apache-airflow-providers-imap
      - apache-airflow-providers-ssh
      - apache-airflow-providers-odbc
      - apache-airflow-providers-redis
      - apache-airflow-providers-postgres
      - apache-airflow-providers-celery
      # - apache-airflow-providers-elasticsearch
      # - apache-airflow-providers-cncf-kubernetes
      # - apache-airflow-providers-docker
      # - apache-airflow-providers-amazon
      # - apache-airflow-providers-apache-spark
      # - apache-airflow-providers-hashicorp

- name: Test Airflow installation
  ansible.builtin.include_tasks: test.yml
...
