# Apply PostgreSQL configuration
---
- name: Include Pretest tasks
  include_tasks: pretest.yml

- name: Reset PostgreSQL default password
  become: yes
  become_method: sudo
  become_user: "{{ DB_ROOT_ROLE }}"
  postgresql_user:
    db: "{{ DB_ROOT_NAME }}"
    name: "{{ DB_ROOT_ROLE }}"
    password: "{{ DB_ROOT_PASS }}"

- name: Deploy pg_hba.conf
  template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_config_dir }}/pg_hba.conf"
    owner: "{{ DB_ROOT_ROLE }}"
    group: "{{ DB_ROOT_ROLE }}"
    mode: "0640"
    backup: true
  notify: restart postgresql

- name: Apply PostgreSQL configuration
  meta: flush_handlers

- name: Deploy postgresql.conf
  template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_config_dir }}/postgresql.conf"
    owner: "{{ DB_ROOT_ROLE }}"
    group: "{{ DB_ROOT_ROLE }}"
    mode: "0644"
    backup: true
  notify: restart postgresql

- name: Reboot server
  reboot:
    msg: "Rebooting machine"

- name: Ensure PostgreSQL service is running after reboot
  systemd:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: true

- name: Test PostgreSQL configuration
  include_tasks: test.yml
...