# Testing PostgreSQL is running with the expected configuration
---
- name: Get shared_buffers setting
  become: true
  become_user: postgres
  command: psql -t -c "SHOW shared_buffers;"
  register: current_shared_buffers
  changed_when: false

- name: Test shared_buffers matches expected value
  assert:
    that:
      - postgresql_shared_buffers in current_shared_buffers.stdout
    fail_msg: "shared_buffers is {{ current_shared_buffers.stdout | trim }}, expected {{ postgresql_shared_buffers | trim }}"

- name: Get max_connections setting
  become: true
  become_user: postgres
  command: psql -t -c "SHOW max_connections;"
  register: current_max_conn
  changed_when: false

- name: Test max_connections matches expected value
  assert:
    that:
      - current_max_conn.stdout | trim | int == postgresql_max_connections
    fail_msg: "max_connections is {{ current_max_conn.stdout | trim }}, expected {{ postgresql_max_connections }}"
...