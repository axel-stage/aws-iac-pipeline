---
- name: Install CloudWatch Agent
  ansible.builtin.apt:
    deb: "{{ cloudwatch_agent_deb_url }}"
    state: present

- name: Deploy agent configuration
  ansible.builtin.template:
    src: cwagent-config.json.j2
    dest: "{{ cloudwatch_agent_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudwatch agent

- name: Apply agent configuration
  ansible.builtin.meta: flush_handlers

- name: Enable CloudWatch agent
  ansible.builtin.systemd:
    name: amazon-cloudwatch-agent
    enabled: true
    state: started

- name: Test CloudWatch agent
  ansible.builtin.include_tasks: test.yml
...
