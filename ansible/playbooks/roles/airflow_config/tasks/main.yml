# Apply Airflow configuration
---
- name: Create Airflow environment file
  ansible.builtin.template:
    src: airflow.env.j2
    dest: "{{ airflow_home }}/.env.airflow"
    mode: "0600"
  notify:
    - Reload systemd
    - Restart Airflow API Server

- name: Verify Airflow environment
  ansible.builtin.shell:
    cmd: |
      echo "PATH=${PATH}"
      echo "AIRFLOW_HOME=${AIRFLOW_HOME}"
      echo "AIRFLOW_CONFIG=${AIRFLOW_CONFIG}"
      echo "AIRFLOW__CORE__EXECUTOR=${AIRFLOW__CORE__EXECUTOR}"
      echo "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}"
      echo "AIRFLOW__CORE__EXECUTION_API_SERVER_URL=${AIRFLOW__CORE__EXECUTION_API_SERVER_URL}"
  args:
    executable: /bin/bash
  register: airflow_env

- name: Display Airflow environment
  ansible.builtin.debug:
    var: airflow_env.stdout_lines

# - name: Set environment variable in config file
#   lineinfile:
#     path: "{{ airflow_home }}/.bashrc"
#     line: export PATH="{{ airflow_venv }}/bin:$PATH"

- name: Create Airflow directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ airflow_user }}"
    group: "{{ airflow_group }}"
    mode: "0755"
  loop:
    - "{{ airflow_home }}/dags"
    - "{{ airflow_home }}/logs"
    - "{{ airflow_home }}/plugins"
    - "{{ airflow_home }}/config"

- name: Build airflow.cfg
  ansible.builtin.shell: >
    airflow config list --defaults > "{{ airflow_home }}/airflow.cfg"
  args:
    executable: /bin/bash

- name: Test PostgreSQL connectivity
  command: >
    python3 -c
    "import psycopg2;
    psycopg2.connect(
      host='{{ postgresql_host }}',
      dbname='{{ postgres_database }}',
      user='{{ postgres_user }}',
      password='{{ postgres_password }}',
      port={{ postgresql_port }}
    );
    print('OK')"
  register: postgres_connection
  changed_when: false

- name: Initialize Airflow metadata database
  ansible.builtin.shell:
    cmd: |
      airflow db migrate
  args:
    executable: /bin/bash

- name: Create Airflow API server systemd service (root)
  become: true
  become_user: "{{ root_user }}"
  template:
    src: airflow-api-server.service.j2
    dest: /etc/systemd/system/airflow-api-server.service
    owner: "{{ root_user }}"
    group: "{{ root_user }}"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Airflow API Server

- name: Create Airflow scheduler systemd service (root)
  become: true
  become_user: "{{ root_user }}"
  template:
    src: airflow-scheduler.service.j2
    dest: /etc/systemd/system/airflow-scheduler.service
    owner: "{{ root_user }}"
    group: "{{ root_user }}"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Airflow Scheduler

- name: Enable Airflow API server service
  become: true
  become_user: "{{ root_user }}"
  systemd:
    name: airflow-api-server
    enabled: true
    state: started
    daemon_reload: true

- name: Enable Airflow scheduler service
  become: true
  become_user: "{{ root_user }}"
  systemd:
    name: airflow-scheduler
    enabled: true
    state: started
    daemon_reload: true