name: Terraform deploy to AWS

on:
  workflow_dispatch

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: 1.15.8
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
  AWS_ROLE_SESSION_NAME: GitHub_to_AWS_via_FederatedOIDC
  WORK_DIR: terraform
  # tfvars
  region: eu-central-1
  project: aws-iac-pipline
  environment: dev
  vpc_cidr_block: 10.10.0.0/16
  public_subnets: '["10.10.0.0/19", "10.10.96.0/19"]'
  dbserver_instance_type: t3.medium
  dbserver_instance_volume_size: 16
  appserver_instance_type: t3.medium
  appserver_instance_volume_size: 8
  force_destroy_bucket: true
  bucket_versioning: Disabled
  postgresql_port: 5432
  meta_db_name: airflow_meta_db
  meta_db_role: dbairflow
  meta_db_conn_limit: 50
  ansible_port: 22
  ansible_user: ubuntu

jobs:

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - name: GIT clone repository
        uses: actions/checkout@v6

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform format code
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - name: GIT clone repository
        uses: actions/checkout@v6

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.WORK_DIR }}

  terraform-plan:
    needs: [terraform-validate] # , terraform-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - name: GIT clone repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: ${{ env.AWS_ROLE_SESSION_NAME }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORK_DIR }}/tfplan

      - name: Comment plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.slice(0, 65000)
            });

  terraform-apply:
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}
    steps:
      - name: GIT clone repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: ${{ env.AWS_ROLE_SESSION_NAME }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORK_DIR }}/

      - name: Terraform apply
        run: terraform apply --auto-approve tfplan
