name: 01 - Building Blocks
on:
  workflow_dispatch:
jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo -e "Hello, World!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed step
        run: |
          echo -e "I will fail"
          exit 1
      - name: Say goodbye
        run: |
          echo -e "Goodbye!"
